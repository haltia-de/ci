# Debian and Ubuntu packages of a Haltia repository (docs/plans/desktop-packages.md
# in haltia-de/haltia): on a vX.Y.Z tag, check that
# debian/changelog is the tag's version, build the packages of debian/ in
# Ubuntu 24.04 noble, Ubuntu 26.04 resolute and Debian 13 trixie, check them with lintian and put
# them, named name_version_arch.codename.deb (GitHub turns a ~ in a
# file name into a dot), with SHA256SUMS.deb into the
# GitHub release of the tag. A repository adds to its release.yml:
#
#   deb:
#     uses: haltia-de/ci/.github/workflows/deb.yml@v1
# upload-apk.py verifies the exact tag commit; identical assets are no-ops.
# Conflicting packages/checksums fail. An unsealed initial batch may resume;
# after the format checksum is published the file set cannot change.
name: deb
on:
  workflow_call:
    secrets:
      PACKAGES_DISPATCH_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  # The build runs the repository's code and its build dependencies: it
  # gets no secret and no token it could write with. The release job runs
  # none of it.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:noble", "ubuntu:resolute", "debian:trixie"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build tools and the package's build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends build-essential devscripts equivs lintian >/dev/null
          mk-build-deps -i -r -t 'apt-get -qq -y --no-install-recommends' debian/control >/dev/null
      - name: The version is the tag's
        run: |
          v=${GITHUB_REF_NAME#v}
          got=$(dpkg-parsechangelog -S Version)
          [ "$got" = "$v" ] || { echo "::error::debian/changelog is $got, the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: |
          dpkg-buildpackage -us -uc -b
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          mkdir out
          for d in ../*.deb; do
            b=$(basename "$d" .deb)
            cp "$d" "out/$b.$codename.deb"
          done
          ls -l out
      - name: lintian
        run: lintian --fail-on error out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ strategy.job-index }}
          path: out/*.deb
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: haltia-de/ci
          ref: v1
          path: .b8k-ci
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: out
          merge-multiple: true
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          PACKAGE_FORMAT: deb
        run: |
          cd out
          python3 ../.b8k-ci/upload-apk.py
      - name: Publish the package repositories now
        # haltia-de/packages otherwise picks the release up at its next
        # 30-minute run. The token (actions: write on haltia-de/packages)
        # comes from the caller's secrets: inherit; without it, skip.
        env:
          DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          [ -n "$DISPATCH_TOKEN" ] || { echo "no PACKAGES_DISPATCH_TOKEN: the next scheduled run publishes"; exit 0; }
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run publish.yml -R haltia-de/packages ||
            echo "::warning::could not start the haltia-de/packages publish"
