# The Flatpak of a Haltia program (docs/plan-desktop-packages.md in
# haltia-de/device-lenovo-b8000h): on a vX.Y.Z tag, check that the
# metainfo has the tag's release, build the manifest with flatpak-builder
# in Flathub's GNOME image and put the bundle, <app id>-<version>.<arch>.flatpak,
# with SHA256SUMS.flatpak into the GitHub release of the tag. A
# repository adds to its release.yml:
#
#   flatpak:
#     uses: haltia-de/ci/.github/workflows/flatpak.yml@v1
#     with:
#       manifest: packaging/flatpak/io.github.haltia_de.Weather.yml
name: flatpak
on:
  workflow_call:
    inputs:
      manifest:
        description: the manifest's path in the repository
        type: string
        required: true
      runtime:
        description: the GNOME runtime version of the manifest (the build image's tag)
        type: string
        default: "51"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-${{ inputs.runtime }}
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: The version is the tag's
        id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          app=$(sed -n 's/^\(app-\)\{0,1\}id: *//p' "${{ inputs.manifest }}" | head -1 | tr -d "'\"")
          [ -n "$app" ] || { echo "::error::no id in ${{ inputs.manifest }}"; exit 1; }
          grep -q "<release version=\"$v\"" "data/$app.metainfo.xml" || { echo "::error::data/$app.metainfo.xml has no release $v"; exit 1; }
          echo "bundle=$app-$v.x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: ${{ inputs.manifest }}
          bundle: ${{ steps.v.outputs.bundle }}
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: ${{ steps.v.outputs.bundle }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak
          path: out
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          cd out
          sha256sum *.flatpak > SHA256SUMS.flatpak
          cat SHA256SUMS.flatpak
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes || true
          # uploads.github.com answers 404 for some files although it keeps
          # them: what counts is that every file is in the release, at its size.
          for try in 1 2 3; do
            gh release upload "$tag" *.flatpak SHA256SUMS.flatpak --clobber || true
            gh release view "$tag" --json assets -q '.assets[]|.name+" "+(.size|tostring)' > have
            missing=0
            for f in *.flatpak SHA256SUMS.flatpak; do
              grep -qx "$f $(stat -c %s "$f")" have || { echo "not yet in the release: $f"; missing=1; }
            done
            [ $missing = 0 ] && exit 0
            sleep $((try * 15))
          done
          exit 1
