# The Flatpak of a Haltia program (docs/plans/desktop-packages.md in
# haltia-de/haltia): on a vX.Y.Z tag, check that the
# metainfo has the tag's release, build the manifest with flatpak-builder
# in Flathub's GNOME image and put the bundle, <app id>-<version>.<arch>.flatpak,
# with SHA256SUMS.flatpak into the GitHub release of the tag. A
# repository adds to its release.yml:
#
#   flatpak:
#     uses: haltia-de/ci/.github/workflows/flatpak.yml@v1
#     with:
#       manifest: packaging/flatpak/io.github.haltia_de.Weather.yml
# upload-apk.py verifies the exact tag commit; identical assets are no-ops.
# Conflicting packages/checksums fail. An unsealed initial batch may resume;
# after the format checksum is published the file set cannot change.
name: flatpak
on:
  workflow_call:
    inputs:
      manifest:
        description: the manifest's path in the repository
        type: string
        required: true
      runtime:
        description: the GNOME runtime version of the manifest (the build image's tag)
        type: string
        default: "51"
    secrets:
      PACKAGES_DISPATCH_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  # The build runs the repository's code and its sources: it gets no
  # secret and no token it could write with. The release job runs none
  # of it.
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-${{ inputs.runtime }}
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: The version is the tag's
        id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          app=$(sed -n 's/^\(app-\)\{0,1\}id: *//p' "${{ inputs.manifest }}" | head -1 | tr -d "'\"")
          [ -n "$app" ] || { echo "::error::no id in ${{ inputs.manifest }}"; exit 1; }
          grep -q "<release version=\"$v\"" "data/$app.metainfo.xml" || { echo "::error::data/$app.metainfo.xml has no release $v"; exit 1; }
          echo "bundle=$app-$v.x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: ${{ inputs.manifest }}
          bundle: ${{ steps.v.outputs.bundle }}
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: ${{ steps.v.outputs.bundle }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: haltia-de/ci
          ref: v1
          path: .b8k-ci
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak
          path: out
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          PACKAGE_FORMAT: flatpak
        run: |
          cd out
          python3 ../.b8k-ci/upload-apk.py
      - name: Publish the package repositories now
        # haltia-de/packages otherwise picks the release up at its next
        # 30-minute run. The token (actions: write on haltia-de/packages)
        # comes from the caller's secrets: inherit; without it, skip.
        env:
          DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          [ -n "$DISPATCH_TOKEN" ] || { echo "no PACKAGES_DISPATCH_TOKEN: the next scheduled run publishes"; exit 0; }
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run publish.yml -R haltia-de/packages ||
            echo "::warning::could not start the haltia-de/packages publish"
