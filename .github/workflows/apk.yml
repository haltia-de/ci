# The release of a b8k repository (ADR 0002 in trudenboy/lenovo-b8000h-linux):
# on a vX.Y.Z tag, check that the versions in the files are the tag's,
# build and sign the Alpine package, and put it with SHA256SUMS into the
# GitHub release of the tag. A repository calls it from its own
# .github/workflows/release.yml:
#
#   on: { push: { tags: ["v*.*.*"] } }
#   permissions: { contents: write }
#   jobs:
#     apk:
#       uses: trudenboy/b8k-ci/.github/workflows/apk.yml@v1
#       with: { arch: noarch }     # armv7 for a package with C parts
#       secrets: inherit
name: apk
on:
  workflow_call:
    inputs:
      arch:
        description: noarch (built on x86) or armv7 (built in an emulated Alpine armv7)
        type: string
        default: noarch
    secrets:
      B8K_APK_PRIVKEY:
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trudenboy/b8k-ci
          ref: v1
          path: .b8k-ci
      - name: The versions are the tag's
        run: |
          tag=$GITHUB_REF_NAME
          v=${tag#v}
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $tag is not vX.Y.Z"; exit 1; }
          grep -qx "pkgver=$v" packaging/alpine/APKBUILD || { echo "::error::APKBUILD pkgver is not $v"; exit 1; }
          grep -qx "pkgrel=0" packaging/alpine/APKBUILD || { echo "::error::APKBUILD pkgrel is not 0"; exit 1; }
          for m in data/*.metainfo.xml; do
            [ -e "$m" ] || continue
            grep -q "<release version=\"$v\"" "$m" || { echo "::error::$m has no release $v"; exit 1; }
          done
          if [ -f pyproject.toml ]; then
            grep -qx "version = \"$v\"" pyproject.toml || { echo "::error::pyproject.toml version is not $v"; exit 1; }
          fi
      - uses: docker/setup-qemu-action@v3
        if: inputs.arch != 'noarch'
      - name: Build and sign the package
        env:
          B8K_APK_PRIVKEY: ${{ secrets.B8K_APK_PRIVKEY }}
        run: |
          platform=linux/amd64
          [ "${{ inputs.arch }}" = armv7 ] && platform=linux/arm/v7
          docker run --rm --platform "$platform" -e B8K_APK_PRIVKEY \
            -v "$PWD:/src" -v "$PWD/.b8k-ci:/ci" alpine:3.24 sh /ci/build-apk.sh
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" out/*.apk out/SHA256SUMS --clobber
