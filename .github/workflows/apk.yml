# The release of a Haltia repository (ADR 0002 and 0004 in haltia-de/haltia):
# on a vX.Y.Z tag (vX.Y.Z_pN for a distribution's package rebuilt with our
# patches, such as libcamera), check that the versions in the files are the tag's,
# build and sign the Alpine package, and put it with SHA256SUMS into the
# GitHub release of the tag. A repository calls it from its own
# .github/workflows/release.yml:
#
#   on: { push: { tags: ["v*.*.*"] } }
#   permissions: { contents: write }
#   jobs:
#     apk:
#       uses: haltia-de/ci/.github/workflows/apk.yml@v1
#       with: { arch: noarch }     # armv7 for a package with C parts
#       secrets: inherit
#
# To add an architecture to a release already out, a repository runs it by
# workflow_dispatch from main with the release's tag as `tag`: it builds the
# tag's sources, adds the packages to that release and merges SHA256SUMS.
# The tag itself is never moved or made again.
name: apk
on:
  workflow_call:
    inputs:
      arch:
        description: noarch (built on x86), or one or more of armv7, aarch64, x86_64, space separated (each built in its own Alpine, emulated when foreign)
        type: string
        default: noarch
      tag:
        description: an existing release vX.Y.Z to add packages to (when run by workflow_dispatch); empty for the pushed tag
        type: string
        default: ""
    secrets:
      B8K_APK_PRIVKEY:
        required: true
      PACKAGES_DISPATCH_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  # The build runs the repository's code (APKBUILD, check()): it gets no
  # secret and no token it could write with, and signs with a throwaway
  # key. The sign job signs with the organisation key and runs only ci.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: haltia-de/ci
          ref: v1
          path: .b8k-ci
          persist-credentials: false
      - name: The versions are the tag's
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag=$TAG
          v=${tag#v}
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(_p[0-9]+)?$' || { echo "::error::tag $tag is not vX.Y.Z or vX.Y.Z_pN"; exit 1; }
          grep -qx "pkgver=$v" packaging/alpine/APKBUILD || { echo "::error::APKBUILD pkgver is not $v"; exit 1; }
          grep -qx "pkgrel=0" packaging/alpine/APKBUILD || { echo "::error::APKBUILD pkgrel is not 0"; exit 1; }
          for m in data/*.metainfo.xml; do
            [ -e "$m" ] || continue
            grep -q "<release version=\"$v\"" "$m" || { echo "::error::$m has no release $v"; exit 1; }
          done
          if [ -f pyproject.toml ]; then
            grep -qx "version = \"$v\"" pyproject.toml || { echo "::error::pyproject.toml version is not $v"; exit 1; }
          fi
      - name: The releases are NEWS.md's
        # A repository with NEWS.md (Russian and English) writes the
        # metainfo's releases from it with news.py; they must match.
        if: hashFiles('NEWS.md') != ''
        run: |
          for m in data/*.metainfo.xml; do
            [ -e "$m" ] || continue
            python3 .b8k-ci/news.py metainfo NEWS.md "$m" --check || exit 1
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: inputs.arch != 'noarch'
      - name: Build the package
        run: |
          for arch in ${{ inputs.arch }}; do
            case $arch in
              noarch|x86_64) platform=linux/amd64 ;;
              armv7) platform=linux/arm/v7 ;;
              aarch64) platform=linux/arm64 ;;
              *) echo "::error::unknown arch $arch"; exit 1 ;;
            esac
            echo "::group::$arch"
            # A local image tag holds one platform: pull this one, or the
            # run reuses the last architecture's image.
            docker pull -q --platform "$platform" alpine:3.24 >/dev/null
            docker run --rm --platform "$platform" -e WANT_ARCH="$arch" \
              -v "$PWD:/src" -v "$PWD/.b8k-ci:/ci" alpine:3.24 sh /ci/build-apk.sh
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: out/*.apk
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: haltia-de/ci
          ref: v1
          path: .b8k-ci
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned
          path: unsigned
      - name: Sign the packages
        env:
          B8K_APK_PRIVKEY: ${{ secrets.B8K_APK_PRIVKEY }}
        run: |
          mkdir -p out
          docker pull -q alpine:3.24 >/dev/null
          docker run --rm -e B8K_APK_PRIVKEY -v "$PWD/unsigned:/in:ro" -v "$PWD/out:/out" \
            -v "$PWD/.b8k-ci:/ci:ro" alpine:3.24 sh /ci/sign-apk.sh
          # Once, over the packages of every architecture.
          cd out
          sha256sum ./*.apk | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag=$TAG
          cd out
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes || true
          # Keep the sums of the files already in the release that this run
          # did not build (another architecture added to it later).
          if gh release download "$tag" -p SHA256SUMS -O ../old.sums 2>/dev/null; then
            { awk 'NR==FNR { built[$2]; next } !($2 in built)' SHA256SUMS ../old.sums; cat SHA256SUMS; } |
              sort -k2 >../merged.sums
            mv ../merged.sums SHA256SUMS
            cat SHA256SUMS
          fi
          # One upload per file: uploads.github.com can answer 404 or 422
          # for files it goes on to keep. Judge success by the release's
          # sha256 digests, allowing up to 10 minutes for storage.
          for f in *.apk SHA256SUMS; do
            gh release upload "$tag" "$f" --clobber || echo "the upload of $f answered an error: waiting for the release to show it"
          done
          for try in $(seq 1 40); do
            if gh api "repos/$GH_REPO/releases/tags/$tag" \
              -q '.assets[]|(.digest // "" | ltrimstr("sha256:"))+"  "+.name' > have; then
              missing=
              for f in *.apk SHA256SUMS; do
                grep -Fxq "$(sha256sum "$f")" have && continue
                missing="$missing $f"
                # Retry twice, only when a successful API response has no
                # asset by this name. Never clobber one still being stored.
                if [ "$try" = 10 ] || [ "$try" = 20 ]; then
                  if ! cut -d ' ' -f3- have | grep -Fxq "$f"; then
                    gh release upload "$tag" "$f" --clobber || echo "the upload of $f answered an error: waiting for the release to show it"
                  fi
                fi
              done
              [ -z "$missing" ] && exit 0
            else
              missing=" (could not read the release digests)"
            fi
            sleep 15
          done
          echo "::error::not in the release as built after 10 minutes:$missing"
          exit 1
      - name: Publish the package repositories now
        # haltia-de/packages otherwise picks the release up at its next
        # 30-minute run. The token (actions: write on haltia-de/packages)
        # comes from the caller's secrets: inherit; without it, skip.
        env:
          DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          [ -n "$DISPATCH_TOKEN" ] || { echo "no PACKAGES_DISPATCH_TOKEN: the next scheduled run publishes"; exit 0; }
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run publish.yml -R haltia-de/packages ||
            echo "::warning::could not start the haltia-de/packages publish"
